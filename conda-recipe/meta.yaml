{% set name = "methscope" %}
{# Version comes from the git tag (GIT_DESCRIBE_TAG, e.g. v0.2 -> 0.2), so it
   can never drift from the release being built.  A hardcoded 0.1.1 survived the
   v0.2 tag and CI silently rebuilt-and-overwrote 0.1.1 instead of publishing
   0.2.  METHSCOPE_VERSION overrides for a build outside a git checkout. #}
{% set version = environ.get('METHSCOPE_VERSION',
                             (environ.get('GIT_DESCRIBE_TAG') or 'v0.0.0')|replace('v','',1)) %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  # In-repo recipe: build the checked-out tree, which already contains the
  # pinned YAME submodule. (GitHub's auto-generated tag tarballs do NOT contain
  # submodules, which is why we do not fetch a url here.) A release build =
  # check out the vX.Y.Z tag, `git submodule update --init`, then conda build.
  path: ..

build:
  # 1: rebuilt against the pinned glibc 2.17 sysroot (was an unpinned 2.34).
  number: 1
  skip: true  # [win]

# Two packages from one source tree. `methscope` is the CPU build everyone
# wants: pure-C inference with libxgboost as the only runtime dependency, and
# the name `conda install methscope` resolves to. `methscope-cuda` adds the CUDA
# training backend and installs as a SEPARATE binary, so both can be installed
# together -- only `upscale-train` needs a GPU, and every other command is
# identical.
outputs:
  - name: {{ name }}
    script: build.sh
    build:
      skip: true  # [win]
    requirements:
      build:
        - {{ compiler('c') }}
        # Pins the glibc/macOS SDK the binary is built against (see
        # conda_build_config.yaml) and adds the matching `__glibc >=2.17` /
        # `__osx >=11.0` run constraint, so the package will not install on a
        # host that is too old to run it.
        - {{ stdlib('c') }}
        - make
      host:
        - libxgboost
        - zlib
      run:
        # libxgboost's and zlib's run_exports pin the runtime automatically;
        # listed for clarity
        - libxgboost
    test:
      commands:
        - methscope --version
        - methscope inspect -h 2>&1 | grep -qi inspect

  - name: {{ name }}-cuda
    script: build_cuda.sh
    build:
      # CUDA is linux-64 only; there is no macOS or Windows GPU build.
      skip: true  # [not linux64]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cuda') }}
        - {{ stdlib('c') }}
        - make
      host:
        - libxgboost
        - zlib
        - cuda-cudart-dev
        - libcublas-dev
      run:
        - libxgboost
        - cuda-cudart
        - libcublas
      run_constrained:
        # Refuse to install where no driver can load the runtime, instead of
        # failing at exec time.
        - __cuda >=12
    test:
      commands:
        - methscope-cuda --version
        - methscope-cuda upscale-train -h 2>&1 | grep -qi cuda

about:
  home: https://github.com/zhou-lab/methscope-cli
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: Sparse DNA methylome analysis via MRMP encoding (C CLI companion to the MethScope R package)
  description: |
    methscope-cli is a pure-C command-line tool for ultra-fast analysis of
    sparse DNA methylomes via Most Recurrent Methylation Pattern (MRMP)
    encoding. It performs the headline MethScope path, taking a query .cg file
    plus an MRMP reference to a cell-by-pattern feature matrix, then to
    XGBoost cell-type prediction or NNLS deconvolution, with no R runtime.
    YAME is linked statically for .cg/.cm I/O and the summary computation;
    libxgboost is the single external runtime dependency.
  dev_url: https://github.com/zhou-lab/methscope-cli

extra:
  recipe-maintainers:
    - zwdzwd
