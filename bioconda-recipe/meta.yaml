{% set version = "0.12" %}

package:
  name: methscope
  version: {{ version }}

source:
  # GitHub's auto-generated tag tarballs do NOT contain the pinned YAME
  # submodule, so this points at the self-contained release asset that does.
  # The tag's CI builds it with `make dist` (reproducible: pre-sorted names,
  # fixed mtime/owner, gzip -n) and prints the sha256; to verify by hand:
  #   gh release download v{{ version }} -R zhou-lab/methscope-cli \
  #     --pattern 'methscope-cli-{{ version }}.tar.gz'
  #   sha256sum methscope-cli-{{ version }}.tar.gz
  url: https://github.com/zhou-lab/methscope-cli/releases/download/v{{ version }}/methscope-cli-{{ version }}.tar.gz
  sha256: 79dc185af8597881ccc95529d0cfaf7e25f7423b1e7b3e55b0e656a86ef32612

build:
  number: 0
  run_exports:
    # keep ABI-compatible against the libxgboost it was built with
    - {{ pin_compatible('libxgboost') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - libxgboost
    - zlib
    # - ncurses   # uncomment if libyame.a linking pulls in ncurses symbols
  run:
    - libxgboost   # usually auto-added via libxgboost's own run_exports
    # The `yame` binary this package does not ship but its docs call; see the
    # in-repo conda-recipe for why the floor is 1.50 and why there is no upper
    # bound. Satisfiable here since 2026-09-22: bioconda carries yame 1.51.
    # It did not when the floor was written -- that channel had stopped at
    # 1.44 -- which would have made this recipe solve to nothing, so check
    # the channel rather than assuming whenever the floor moves again.
    - yame >=1.50

test:
  commands:
    - methscope 2>&1 | grep -qi methscope

about:
  home: https://github.com/zhou-lab/methscope-cli
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: "Sparse DNA methylome analysis via MRMP encoding (C CLI companion to the MethScope R package)"
  dev_url: https://github.com/zhou-lab/methscope-cli

extra:
  recipe-maintainers:
    - zwdzwd
