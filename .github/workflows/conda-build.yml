name: conda-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-64}
          - {os: macos-14,      name: osx-arm64}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # .gitmodules pins YAME by SSH URL, which the runner cannot use. Rewrite
      # it to HTTPS (YAME is public) so the submodule checkout succeeds.
      - name: Use HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # The recipe builds the checked-out tree, so the pinned YAME submodule
      # must be present.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install conda-build
        run: conda install -n base -y conda-build anaconda-client

      - name: Build package
        run: |
          # The recipe reads METHSCOPE_VERSION. On a tag build that is the tag
          # itself, so the published version can never drift from the release
          # (a hardcoded 0.1.1 survived the v0.2 tag and CI rebuilt-and-
          # overwrote 0.1.1). Untagged builds are not published, so a 0.0.0.devN
          # placeholder is fine and is visibly not a release.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            METHSCOPE_VERSION="${GITHUB_REF_NAME#v}"
          else
            METHSCOPE_VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}"
          fi
          export METHSCOPE_VERSION
          echo "building version ${METHSCOPE_VERSION}"
          conda build -c zhou-lab -c conda-forge \
            --output-folder "$RUNNER_TEMP/bld" conda-recipe/

      # Separate recipe, linux-64 only: methscope with the CUDA training backend
      # compiled in, installed as `methscope-cuda` so both can coexist. Kept out
      # of conda-recipe/ because making that a multi-output recipe broke the
      # osx-arm64 build.
      - name: Build CUDA package (linux-64 only)
        if: matrix.name == 'linux-64'
        # Never block the methscope publish: this package is optional (only
        # upscale-train needs a GPU) and it runs before the upload steps.
        continue-on-error: true
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            METHSCOPE_VERSION="${GITHUB_REF_NAME#v}"
          else
            METHSCOPE_VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}"
          fi
          export METHSCOPE_VERSION
          conda build -c zhou-lab -c conda-forge -c nvidia \
            --output-folder "$RUNNER_TEMP/bld" conda-recipe-cuda/

      # The runner's glibc is far newer than users'. If the sysroot pin ever
      # comes loose, the binary silently picks up symbols no ordinary machine
      # has and dies at startup -- how sesame-cli and tabl both shipped broken.
      - name: Check glibc floor (linux-64)
        if: matrix.name == 'linux-64'
        run: python tools/check_glibc_floor.py "$RUNNER_TEMP/bld"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.name }}
          path: ${{ runner.temp }}/bld/**/*.conda
          if-no-files-found: error

      - name: Publish to zhou-lab (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN secret is not set; cannot publish." >&2
            exit 1
          fi
          # The recipe now takes its version from the tag (METHSCOPE_VERSION),
          # so meta.yaml holds no literal to compare against. Check the built
          # ARTIFACT instead -- a stronger guard, since it verifies what will
          # actually be uploaded rather than what the source claims.
          tag="${GITHUB_REF_NAME#v}"
          if ! ls "$RUNNER_TEMP"/bld/*/*-"${tag}"-*.conda >/dev/null 2>&1; then
            echo "no built package carries version ${tag}:" >&2
            ls -1 "$RUNNER_TEMP"/bld/*/*.conda >&2 || true
            exit 1
          fi
          for pkg in "$RUNNER_TEMP"/bld/*/*.conda; do
            echo "uploading $pkg"
            conda run -n base anaconda -t "$ANACONDA_TOKEN" upload \
              -u zhou-lab --label main --force "$pkg"
          done

  # A tag is only a ref; a GitHub Release is a separate object with assets, so
  # they do not sync on their own -- which is why the newest Release stayed at
  # v0.1.0 while tags moved on. This publishes one per tag, carrying the
  # `make dist` tarball: GitHub's auto-generated tag tarballs OMIT the pinned
  # YAME submodule, and bioconda-recipe's `source: url:` needs one that has it.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build          # only if both platforms built
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required to create a release
    steps:
      - name: Use HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # `make dist` reads git ls-files and derives DIST_VERSION from
      # `git describe --tags`, so it needs the submodule AND full tag history.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build the release tarball
        run: |
          make dist
          ls -l dist/

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="dist/methscope-cli-${tag#v}.tar.gz"
          test -f "$asset" || { echo "expected $asset" >&2; ls -1 dist >&2; exit 1; }
          # Idempotent: a re-run (or a force-moved tag) refreshes the asset
          # rather than failing on an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "$tag" --generate-notes
          fi
          echo "sha256 (for bioconda-recipe source):"
          sha256sum "$asset"
