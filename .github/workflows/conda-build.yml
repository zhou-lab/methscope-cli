name: conda-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-64}
          - {os: macos-14,      name: osx-arm64}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # .gitmodules pins YAME by SSH URL, which the runner cannot use. Rewrite
      # it to HTTPS (YAME is public) so the submodule checkout succeeds.
      - name: Use HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # The recipe builds the checked-out tree, so the pinned YAME submodule
      # must be present.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install conda-build
        run: conda install -n base -y conda-build anaconda-client

      - name: Build package
        run: |
          conda build -c zhou-lab -c conda-forge \
            --output-folder "$RUNNER_TEMP/bld" conda-recipe/

      # The runner's own glibc is far newer than what users have. Without the
      # 2.17 sysroot pin the binary silently picks up symbols from the runner's
      # glibc and dies at startup on normal machines -- sesame-cli shipped a
      # package that way. Fail the build here instead of from a bug report.
      - name: Check glibc floor (linux-64)
        if: matrix.name == 'linux-64'
        run: |
          pkg=$(ls "$RUNNER_TEMP"/bld/linux-64/*.conda | head -1)
          work=$(mktemp -d); cd "$work"
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('.')" "$pkg"
          tar -xf pkg-*.tar.zst
          rc=0
          for b in bin/*; do
            max=$(objdump -T "$b" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
            [ -n "$max" ] || continue          # not an ELF binary, or links nothing
            echo "$b requires at most $max"
            # sort -V puts the higher of the two last; if that is not 2.17, the
            # binary needs something newer than the pinned sysroot provides.
            if [ "$(printf '%s\nGLIBC_2.17\n' "$max" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
              echo "::error::$b requires $max, above the pinned GLIBC_2.17 floor" >&2
              objdump -T "$b" | grep -E 'GLIBC_2\.(1[89]|[2-9][0-9])' >&2 || true
              rc=1
            fi
          done
          exit $rc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.name }}
          path: ${{ runner.temp }}/bld/**/*.conda
          if-no-files-found: error

      - name: Publish to zhou-lab (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN secret is not set; cannot publish." >&2
            exit 1
          fi
          # guard: the pushed tag must match the recipe version
          version=$(sed -n 's/.*set version = "\(.*\)".*/\1/p' conda-recipe/meta.yaml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match recipe version $version; bump meta.yaml" >&2
            exit 1
          fi
          for pkg in "$RUNNER_TEMP"/bld/*/*.conda; do
            echo "uploading $pkg"
            conda run -n base anaconda -t "$ANACONDA_TOKEN" upload \
              -u zhou-lab --label main --force "$pkg"
          done
